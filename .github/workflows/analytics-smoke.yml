name: Verify Parris Analytics public endpoint
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-smoke.yml'
      - 'index.html'
  workflow_dispatch:
  schedule:
    - cron: '21 6 * * *'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Worker database health and browser SDK
        shell: bash
        run: |
          set -euo pipefail
          URL="https://parris-analytics.parris-neathaustralia.workers.dev"
          curl --fail --show-error --silent --retry 3 --retry-delay 5 "$URL/health" | tee health.json
          grep -q '"ok":true' health.json
          curl --fail --show-error --silent --retry 3 --retry-delay 5 "$URL/tracker.js?v=2" -o /tmp/analytics-tracker.js
          grep -q 'parris-analytics-consent-v1' /tmp/analytics-tracker.js
          grep -q 'pointer-events:none' /tmp/analytics-tracker.js
          grep -q 'pointer-events:auto' /tmp/analytics-tracker.js
      - name: Verify end-to-end D1 write using diagnostic-only event
        shell: bash
        run: |
          set -euo pipefail
          URL="https://parris-analytics.parris-neathaustralia.workers.dev"
          CODE=$(curl --show-error --silent --retry 3 --retry-delay 5 -o /tmp/result -w '%{http_code}' -X POST "$URL/event" -H 'Origin: https://parris-tech-services.github.io' -H 'Content-Type: application/json' --data '{"site":"breach-command","path":"/breach-command/","event":"test"}')
          cat /tmp/result
          test "$CODE" = "204"
      - name: Verify browser CORS preflight
        shell: bash
        run: |
          set -euo pipefail
          URL="https://parris-analytics.parris-neathaustralia.workers.dev/event"
          CODE=$(curl --silent --show-error -D /tmp/cors-headers -o /tmp/cors-body -w '%{http_code}' -X OPTIONS "$URL" -H 'Origin: https://parris-tech-services.github.io' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type')
          test "$CODE" = "204"
          grep -iq 'access-control-allow-origin: https://parris-tech-services.github.io' /tmp/cors-headers
          grep -iq 'access-control-allow-headers: content-type' /tmp/cors-headers
      - name: Verify invalid origin is rejected
        shell: bash
        run: |
          set -euo pipefail
          URL="https://parris-analytics.parris-neathaustralia.workers.dev"
          CODE=$(curl --show-error --silent -o /tmp/deny -w '%{http_code}' -X POST "$URL/event" -H 'Origin: https://unapproved.example' -H 'Content-Type: application/json' --data '{"site":"breach-command","path":"/breach-command/","event":"test"}')
          cat /tmp/deny
          test "$CODE" = "403"

      - name: Audit live GitHub Pages tracker publication (non-blocking)
        shell: bash
        run: |
          set -uo pipefail
          echo '### Live analytics tracker coverage' >> "$GITHUB_STEP_SUMMARY"
          for repo in FaithHub breach-command StarHaven Marsh Wild2 Echo ElodinDeepLore elodin-deep-lore delve kkc-adventure NebulaDice-Browser random-play Repository-town Arena ashfaller drifter lantern-road lore NeathBound schism TextGame wastes-courier-roguelike WhirringWilderness exitbackup JoshOS-Stage0 JoshRS ParrisPiano SwordCoast; do
            URL="https://parris-tech-services.github.io/$repo/index.html?parris_probe=20261031"
            if curl -fLsS --max-time 20 --retry 2 "$URL" -o /tmp/tracked.html && grep -Fq 'parris-analytics.parris-neathaustralia.workers.dev/tracker.js' /tmp/tracked.html; then
              echo "$repo : PUBLISHED" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "$repo : NOT CONFIRMED" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Discover other live public game sites
        shell: bash
        run: |
          set -uo pipefail
          echo '### Additional game deployment discovery (not yet instrumented)' >> "$GITHUB_STEP_SUMMARY"
          for repo in Arena ashfaller bramblewick CanonRPG drifter lantern-road lore NeathBound schism TextGame wastes-courier-roguelike WhirringWilderness JoshChess RothfussMaps SwordCoast; do
            URL="https://parris-tech-services.github.io/$repo/index.html?parris_probe=20261031"
            if curl -fLsS --max-time 15 --retry 1 "$URL" -o /tmp/discovery.html && grep -Eiq '<html|<!doctype' /tmp/discovery.html; then
              echo "$repo : LIVE" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "$repo : NOT CONFIRMED" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Verify published JoshOS shell tracker
        shell: bash
        run: |
          URL="https://parris-tech-services.github.io/JoshOS-Stage0/shell/index.html?parris_probe=20261031"
          if curl -fLsS --max-time 20 "$URL" -o /tmp/joshos.html && grep -Fq 'data-site="joshos-shell"' /tmp/joshos.html; then
            echo "JoshOS-Stage0 shell : PUBLISHED" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "JoshOS-Stage0 shell : NOT CONFIRMED" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Diagnostic-only write checks for every registered site
        shell: bash
        run: |
          set -euo pipefail
          API="https://parris-analytics.parris-neathaustralia.workers.dev/event"
          ORIGIN="https://parris-tech-services.github.io"
          sites=(
            'arena|/Arena/' 'ashfaller|/ashfaller/' 'breach-command|/breach-command/'
            'delve|/delve/' 'drifter|/drifter/' 'echo|/Echo/'
            'elodin-deep-lore|/elodin-deep-lore/' 'elodin-lore|/ElodinDeepLore/'
            'faithhub|/FaithHub/' 'hitchhiker-rpg|/exitbackup/'
            'joshos-shell|/JoshOS-Stage0/' 'joshrs|/JoshRS/'
            'kkc-adventure|/kkc-adventure/' 'lantern-road|/lantern-road/'
            'lore|/lore/' 'marsh|/Marsh/' 'neathbound|/NeathBound/'
            'nebula-dice|/NebulaDice-Browser/' 'parris-piano|/ParrisPiano/'
            'random-play|/random-play/' 'repository-town|/Repository-town/'
            'schism|/schism/' 'star-haven|/StarHaven/' 'sword-coast|/SwordCoast/'
            'textgame|/TextGame/' 'wastes-courier|/wastes-courier-roguelike/'
            'whirring-wilderness|/WhirringWilderness/' 'wild2|/Wild2/'
          )
          count=0
          for entry in "${sites[@]}"; do
            IFS='|' read -r site path <<< "$entry"
            code=$(curl --silent --show-error --max-time 12 -o /tmp/diag-response -w '%{http_code}' \
              -X POST "$API" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' \
              --data "{\"site\":\"$site\",\"path\":\"$path\",\"event\":\"test\"}")
            if [[ "$code" != "204" ]]; then
              echo "FAILED: $site ($code): $(cat /tmp/diag-response)"
              exit 1
            fi
            count=$((count+1))
          done
          echo "Diagnostic-only D1 writes passed for $count registered site IDs" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify Vercel production domains and diagnostic origin rules
        shell: bash
        run: |
          set -euo pipefail
          API="https://parris-analytics.parris-neathaustralia.workers.dev/event"
          echo '### Vercel production checks' >> "$GITHUB_STEP_SUMMARY"
          for item in 'joshrs|joshrs.vercel.app' 'parris-piano|parrispiano.vercel.app' 'sword-coast|sword-coast.vercel.app'; do
            IFS='|' read -r site host <<< "$item"
            page="https://$host/index.html?parris_probe=20261031"
            published="NOT CONFIRMED"
            if curl --silent --show-error --fail --location --max-time 20 "$page" -o /tmp/parris-vercel.html &&
              grep -Fq 'parris-analytics.parris-neathaustralia.workers.dev/tracker.js' /tmp/parris-vercel.html &&
              grep -Fq "data-site=\"$site\"" /tmp/parris-vercel.html; then
              published="PUBLISHED"
            fi
            code=$(curl --silent --show-error -o /tmp/parris-vercel-test -w '%{http_code}' \
              -X POST "$API" -H "Origin: https://$host" -H 'Content-Type: application/json' \
              --data "{\"site\":\"$site\",\"path\":\"/\",\"event\":\"test\"}")
            echo "$site : $published ; diagnostic HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
            [[ "$code" == "204" ]] || exit 1
          done

      - name: Verify FaithHub public reading pages
        shell: bash
        run: |
          set -uo pipefail
          echo '### FaithHub reading-page tracking' >> "$GITHUB_STEP_SUMMARY"
          for page in index.html cornerstone-teachings.html ab401a-genesis.html daily-prayer.html podcasts.html prayer-library.html prayer-practice.html psalms.html saints-prayer.html scripture-atlas.html; do
            URL="https://parris-tech-services.github.io/FaithHub/$page?parris_probe=20261031"
            if curl -fLsS --retry 2 --max-time 20 "$URL" -o /tmp/faithpage.html && grep -Fq 'data-site="faithhub"' /tmp/faithpage.html; then
              echo "$page : PUBLISHED" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "$page : NOT CONFIRMED" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Probe Vercel public production sites
        shell: bash
        run: |
          set -uo pipefail
          echo '### Vercel public analytics coverage' >> "$GITHUB_STEP_SUMMARY"
          for entry in parrispiano.vercel.app:parris-piano sword-coast.vercel.app:sword-coast joshrs.vercel.app:joshrs; do
            HOST="${entry%%:*}"
            SITE="${entry#*:}"
            URL="https://$HOST/?parris_probe=20261031"
            if curl -fLsS --retry 2 --max-time 20 "$URL" -o /tmp/vercel.html && grep -Fq "data-site=\"$SITE\"" /tmp/vercel.html; then
              echo "$HOST : PUBLISHED" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "$HOST : NOT CONFIRMED" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: New cross-repo analytics production deployment audit
        shell: bash
        run: |
          set -uo pipefail
          echo '### New production rollouts' >> "$GITHUB_STEP_SUMMARY"
          for entry in 'astra-dnd|astra-dnd-game.vercel.app' 'appfactory|app-factory-gamma.vercel.app' 'eleven-realms|realms-bay.vercel.app' 'ashfallen|ashfallen.vercel.app' 'parris-tech-services|parris-tech-services-app.vercel.app' 'aetheria|skill-deploy-fs1ircxjkn.vercel.app' 'chess|chess-kappa-five.vercel.app' 'josh-cards|josh-cards-gamma.vercel.app' 'waypoint|waypoint-azure.vercel.app' 'chess|chess-rho-gilt.vercel.app' 'eleven-realms|eleven-realms.vercel.app' 'arena|llm-gladiator-arena.vercel.app' 'drifter|drifter-sigma.vercel.app' 'lore|lore-beryl.vercel.app'; do
            IFS='|' read -r site host <<< "$entry"
            if curl -fLsS --retry 1 --max-time 15 "https://$host/?analytics_probe=20261031" -o /tmp/site.html && grep -Fq 'parris-analytics.parris-neathaustralia.workers.dev' /tmp/site.html; then
              echo "$site @ $host : PUBLISHED" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "$site @ $host : NOT VERIFIED" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo '### JoshHub per-game published tracker checks' >> "$GITHUB_STEP_SUMMARY"
          for game in buckland-blocks forbidden-quests mysterious-depths neverwinter-tales starhaven; do
            for host in josh-hub-two.vercel.app josh-hub-96no.vercel.app; do
              url="https://$host/games/$game/index.html?analytics_probe=20261031"
              if curl -fLsS --retry 1 --max-time 12 "$url" -o /tmp/game.html && grep -Fq "data-site=\"joshhub-$game\"" /tmp/game.html; then
                echo "$host/$game : PUBLISHED" | tee -a "$GITHUB_STEP_SUMMARY"
              else
                echo "$host/$game : NOT VERIFIED" | tee -a "$GITHUB_STEP_SUMMARY"
              fi
            done
          done
